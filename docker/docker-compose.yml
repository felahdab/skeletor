services:
    web:
        image: nginxinc/nginx-unprivileged
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - ../:/app
        restart: unless-stopped
        ports:
          - ${NGINX_PORT}:8080
        depends_on:
          - php
          - db
          - pgadmin
          - code-editor
          - markserv
    php:
        image: poseidon/php
        build: ./php
        environment:
          NGINX_WEBROOT: /app
        volumes:
            - ../:/app
            - backups:/backups
        restart: unless-stopped
    db:
        image: postgres:18-alpine
        environment:
          POSTGRES_USER: 'skeletoruser'
          POSTGRES_PASSWORD: 'skeletorpassword'
          POSTGRES_DB: 'skeletordb'
        volumes:
            - postgres_data:/var/lib/postgresql/
        restart: unless-stopped
    markserv:
        image: falahdab/markserv:1.0
        restart: unless-stopped
        volumes:
           - ../resources/docs/:/usr/src/app/md/
    redis:
        image: docker.io/library/redis:7.0
        restart: unless-stopped
        environment:
          REDIS_PASSWORD: 'redispassword'
    # phpmyadmin:
    #     image:  docker.io/library/phpmyadmin:5
    #     environment:
    #        PMA_ABSOLUTE_URI: http://localhost/apps/pma/
    #        DATABASE_HOST: db
    #     restart: unless-stopped
    pgadmin:
        image: dpage/pgadmin4
        restart: unless-stopped
        environment:
          PGADMIN_DEFAULT_EMAIL: admin@skeletor.fr
          PGADMIN_DEFAULT_PASSWORD: changeme
    code-editor:
        image: falahdab/codeserver:1.4
        user: "82:82"
        volumes:
          - ./code-editor-ssh:/home/coder/.ssh
          - ../:/home/coder/app
          - backups:/backups
        restart: unless-stopped
volumes:
    postgres_data: {}
    backups: {}
